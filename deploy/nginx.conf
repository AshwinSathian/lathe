server {
  listen 8080;
  root /usr/share/nginx/html;
  absolute_redirect off;
  gzip on;
  gzip_types text/css text/plain application/javascript text/javascript application/json application/wasm image/svg+xml;

  # nginx drops inherited add_header lines when a block adds its own, so each block includes the full set.
  set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";

  # Only the two tools that download a large model may reach those hosts.
  location ~ ^/(remove-background|upscale-image)$ {
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' blob: data: https://cdn.jsdelivr.net https://huggingface.co https://*.huggingface.co https://*.hf.co; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";
    include /etc/nginx/conf.d/lathe-headers.inc;
    add_header Cache-Control "public, max-age=60" always;
    try_files $uri.html =404;
  }
  location /_astro/ {
    include /etc/nginx/conf.d/lathe-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location = /sw.js {
    include /etc/nginx/conf.d/lathe-headers.inc;
    add_header Cache-Control "no-cache" always;
  }
  location / {
    include /etc/nginx/conf.d/lathe-headers.inc;
    add_header Cache-Control "public, max-age=60" always;
    try_files $uri $uri.html $uri/ =404;
  }
  error_page 404 /404.html;
}
