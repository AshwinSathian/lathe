name: Bug report
description: A tool gave a wrong result, failed or broke the page.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not attach private documents or photos. A small file that shows the same problem is ideal.
  - type: input
    id: tool
    attributes: { label: Tool, description: The page address or tool name., placeholder: https://lathe.ashwinsathian.com/compress-pdf }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include the exact message on screen., placeholder: "I dropped a 40-page PDF and saw ..." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
    validations: { required: true }
  - type: input
    id: file
    attributes: { label: File type and size, placeholder: "PDF, 40 pages, 18 MB" }
    validations: { required: true }
  - type: input
    id: browser
    attributes: { label: Browser and device, placeholder: "Safari 26 on iPhone 16" }
    validations: { required: true }
  - type: textarea
    id: console
    attributes: { label: Console errors, description: Optional. Check they contain nothing private., render: text }
