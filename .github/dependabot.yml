version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # The runtime loader and the CDN binary must move together, so these are updated and tested by hand.
    ignore:
      - dependency-name: "@huggingface/transformers"
      - dependency-name: onnxruntime-web
      # @astrojs/check 0.9.12 accepts TypeScript 5 and 6 only. TypeScript 7 runs through the typescript-native alias.
      # Remove this rule when @astrojs/check accepts 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
