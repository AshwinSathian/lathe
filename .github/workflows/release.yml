name: Release
# Pushing a tag such as v0.2.0 publishes the built site with an SBOM and signed build provenance.
on:
  push: { tags: ["v*.*.*"] }
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: tar -czf "lathe-${GITHUB_REF_NAME}-site.tar.gz" -C dist .
      - run: npm sbom --omit=dev --sbom-format=spdx > "lathe-${GITHUB_REF_NAME}.spdx.json"
      - run: sha256sum lathe-* > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            lathe-*.tar.gz
            lathe-*.spdx.json
      - run: gh release create "$GITHUB_REF_NAME" lathe-* SHA256SUMS --verify-tag --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
