name: Production check
# Runs daily against the live site, so a broken header, page or engine is noticed without a release.
on:
  schedule: [{ cron: "41 3 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { LATHE_URL: "https://lathe.ashwinsathian.com" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/live.spec.ts tests/production.spec.ts tests/supply-chain.spec.ts --project=chromium
